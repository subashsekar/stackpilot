name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pypi
    permissions:
      contents: read
      # Trusted Publishing (OIDC) — no API tokens.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Run pytest
        timeout-minutes: 30
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          pytest -vv -ra --maxfail=3 --durations=20 --color=yes
          --tb=short --showlocals
          --junitxml=pytest-results.xml

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Install wheel and verify console entry points
        run: |
          python -m pip install dist/*.whl
          stackpilot version
          stackpilot doctor || true
          python -m stackpilot version
          python -m stackpilot --help
          stackpilot --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
