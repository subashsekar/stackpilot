name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pypi
    permissions:
      contents: read
      # Trusted Publishing (OIDC) — no API tokens.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Run pytest
        timeout-minutes: 30
        env:
          PYTHONFAULTHANDLER: "1"
          PYTEST_ADDOPTS: ""
        run: >
          pytest -vv -ra --maxfail=3 --durations=20 --color=yes
          --tb=short --showlocals
          --junitxml=pytest-results.xml

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-publish-py3.12
          path: |
            pytest-results.xml
            **/runtime.json
            **/.stackpilot/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "===== PUBLISH FAILURE DIAGNOSTICS ====="
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "cwd: $(pwd)"
          echo "uname: $(uname -a 2>/dev/null || true)"
          echo
          echo "----- python -----"
          python -V
          python -c "import sys,platform; print(sys.executable); print(platform.platform())"
          echo
          echo "----- installed packages -----"
          python -m pip freeze || true
          echo
          echo "----- pytest cache -----"
          ls -la .pytest_cache 2>/dev/null || true
          find .pytest_cache -type f 2>/dev/null | head -n 50 || true
          echo
          echo "----- runtime files -----"
          find . -name 'runtime.json' 2>/dev/null | head -n 50 || true
          find . -path '*/.stackpilot/*' 2>/dev/null | head -n 100 || true
          echo
          echo "----- .stackpilot/runtime.json (if any) -----"
          find . -path '*/.stackpilot/runtime.json' -print -exec python -c "import pathlib,sys; p=pathlib.Path(sys.argv[1]); print(p.read_text(encoding='utf-8', errors='replace')[:4000])" {} \; 2>/dev/null || true
          echo
          echo "----- processes -----"
          if command -v ps >/dev/null 2>&1; then
            ps -ef || ps aux || true
          else
            python - <<'PY'
          import os, subprocess, sys
          try:
              out = subprocess.check_output(["tasklist"], text=True, errors="replace")
              print(out)
          except Exception as exc:
              print("tasklist failed:", exc, file=sys.stderr)
          PY
          fi
          echo
          echo "----- open TCP listeners (best effort) -----"
          if command -v ss >/dev/null 2>&1; then
            ss -lntp || true
          elif command -v netstat >/dev/null 2>&1; then
            netstat -an | head -n 200 || true
          else
            python - <<'PY'
          import socket
          print("no ss/netstat; probing common ephemeral bind capability only")
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print("bind ok", s.getsockname())
          s.close()
          PY
          fi
          echo
          echo "----- python child / sleep / uvicorn / flask procs -----"
          python - <<'PY'
          import os, re, subprocess, sys
          try:
              if sys.platform == "win32":
                  out = subprocess.check_output(["wmic", "process", "get", "ProcessId,CommandLine"], text=True, errors="replace")
              else:
                  out = subprocess.check_output(["ps", "-ef"], text=True, errors="replace")
          except Exception as exc:
              print("process list failed:", exc)
              raise SystemExit(0)
          keys = ("python", "pytest", "uvicorn", "flask", "sleep", "stackpilot", "HTTPServer")
          for line in out.splitlines():
              low = line.lower()
              if any(k in low for k in keys):
                  print(line)
          PY
          echo "===== END DIAGNOSTICS ====="

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Install wheel and verify console entry points
        run: |
          python -m pip install dist/*.whl
          stackpilot version
          stackpilot doctor || true
          python -m stackpilot version
          python -m stackpilot --help
          stackpilot --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
