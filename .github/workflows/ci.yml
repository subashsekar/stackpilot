name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        timeout-minutes: 30
        env:
          PYTHONFAULTHANDLER: "1"
          PYTEST_ADDOPTS: ""
        run: >
          pytest -vv -ra --maxfail=3 --durations=20 --color=yes
          --tb=short --showlocals

      - name: Dump failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "===== CI FAILURE DIAGNOSTICS ====="
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "cwd: $(pwd)"
          echo "uname: $(uname -a 2>/dev/null || true)"
          echo
          echo "----- python -----"
          python -V
          python -c "import sys,platform; print(sys.executable); print(platform.platform())"
          echo
          echo "----- installed packages -----"
          python -m pip freeze || true
          echo
          echo "----- pytest cache -----"
          ls -la .pytest_cache 2>/dev/null || true
          find .pytest_cache -type f 2>/dev/null | head -n 50 || true
          echo
          echo "----- runtime files -----"
          find . -name 'runtime.json' 2>/dev/null | head -n 50 || true
          find . -path '*/.stackpilot/*' 2>/dev/null | head -n 100 || true
          echo
          echo "----- .stackpilot/runtime.json (if any) -----"
          find . -path '*/.stackpilot/runtime.json' -print -exec python -c "import pathlib,sys; p=pathlib.Path(sys.argv[1]); print(p.read_text(encoding='utf-8', errors='replace')[:4000])" {} \; 2>/dev/null || true
          echo
          echo "----- processes -----"
          if command -v ps >/dev/null 2>&1; then
            ps -ef || ps aux || true
          else
            python - <<'PY'
          import os, subprocess, sys
          try:
              out = subprocess.check_output(["tasklist"], text=True, errors="replace")
              print(out)
          except Exception as exc:
              print("tasklist failed:", exc, file=sys.stderr)
          PY
          fi
          echo
          echo "----- open TCP listeners (best effort) -----"
          if command -v ss >/dev/null 2>&1; then
            ss -lntp || true
          elif command -v netstat >/dev/null 2>&1; then
            netstat -an | head -n 200 || true
          else
            python - <<'PY'
          import socket
          print("no ss/netstat; probing common ephemeral bind capability only")
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print("bind ok", s.getsockname())
          s.close()
          PY
          fi
          echo
          echo "----- python child / sleep / uvicorn / flask procs -----"
          python - <<'PY'
          import os, re, subprocess, sys
          try:
              if sys.platform == "win32":
                  out = subprocess.check_output(["wmic", "process", "get", "ProcessId,CommandLine"], text=True, errors="replace")
              else:
                  out = subprocess.check_output(["ps", "-ef"], text=True, errors="replace")
          except Exception as exc:
              print("process list failed:", exc)
              raise SystemExit(0)
          keys = ("python", "pytest", "uvicorn", "flask", "sleep", "stackpilot", "HTTPServer")
          for line in out.splitlines():
              low = line.lower()
              if any(k in low for k in keys):
                  print(line)
          PY
          echo "===== END DIAGNOSTICS ====="

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Verify artifact contents
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path

          dist = Path("dist")
          sdists = list(dist.glob("*.tar.gz"))
          wheels = list(dist.glob("*.whl"))
          assert sdists, "missing sdist"
          assert wheels, "missing wheel"

          bad = []
          with tarfile.open(sdists[0], "r:gz") as tf:
              names = tf.getnames()
              for name in names:
                  if "__pycache__" in name or name.endswith((".pyc", ".pyo")):
                      bad.append(name)
              assert any(n.endswith("LICENSE") or n.endswith("/LICENSE") for n in names), names
              assert any("CHANGELOG.md" in n for n in names), names
              assert any("README.md" in n for n in names), names
              assert any(n.endswith("py.typed") for n in names), names

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              for name in names:
                  if "__pycache__" in name or name.endswith((".pyc", ".pyo")):
                      bad.append(name)
              assert any(n.endswith("py.typed") for n in names), "wheel missing py.typed"
              assert any(
                  ".dist-info/LICENSE" in n or n.endswith("LICENSE") for n in names
              ), "wheel missing LICENSE"
              # entry_points.txt must declare the console script
              ep_names = [n for n in names if n.endswith(".dist-info/entry_points.txt")]
              assert ep_names, "wheel missing entry_points.txt"
              ep_text = zf.read(ep_names[0]).decode("utf-8")
              assert "stackpilot" in ep_text, ep_text
              assert "stackpilot.cli:main" in ep_text, ep_text
              # METADATA must include classifiers / project URLs
              meta_names = [n for n in names if n.endswith(".dist-info/METADATA")]
              assert meta_names, "wheel missing METADATA"
              meta = zf.read(meta_names[0]).decode("utf-8")
              assert "Programming Language :: Python :: 3.10" in meta
              assert "Programming Language :: Python :: 3.13" in meta
              assert "Home-page:" in meta or "Project-URL:" in meta

          assert not bad, bad
          print("artifacts ok", sdists[0].name, wheels[0].name)
          PY

      - name: Install from wheel and verify CLI
        run: |
          python -m pip install dist/*.whl
          stackpilot version
          stackpilot doctor || true
          python -m stackpilot version
          python -m stackpilot --help
          # Create a minimal project and confirm doctor/graph/module entry work
          mkdir -p /tmp/sp-wheel-check/svc
          cat > /tmp/sp-wheel-check/Stackfile.py <<'EOF'
          from stackpilot import Stack
          stack = Stack()
          stack.service(
              name="demo",
              path="./svc",
              command="python -c \"print('ok')\"",
          )
          stack.run()
          EOF
          cd /tmp/sp-wheel-check
          stackpilot doctor
          stackpilot graph
          python -m stackpilot doctor

      - name: Fail if README rendering is broken
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("README.md").read_text(encoding="utf-8")
          assert text.strip(), "README.md is empty"
          # Basic structure checks (twine already validates long_description)
          for heading in ("## Quick Start", "## Commands", "## Troubleshooting", "## FAQ"):
              assert heading in text, f"missing section {heading}"
          # No references to removed CLI / log system
          assert "stackpilot logs" not in text or "Where did" in text
          assert ".stackpilot/logs/" not in text or "not `.stackpilot/logs/`" in text
          # Public commands still documented
          for cmd in (
              "init", "sync", "run", "stop", "graph", "status", "ps",
              "issues", "doctor", "version",
          ):
              assert f"stackpilot {cmd}" in text or f"`{cmd}`" in text, cmd
          print("README structure ok")
          PY
