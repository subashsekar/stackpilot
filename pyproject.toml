[project]
name = "stackpilot"
dynamic = ["version"]
description = "Local microservice process orchestrator: dependency-aware startup, health checks, and hot reload without Docker."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "StackPilot contributors" }]
keywords = [
  "microservices",
  "process-manager",
  "local-development",
  "orchestrator",
  "devtools",
  "fastapi",
  "flask",
  "django",
  "celery",
  "express",
  "nestjs",
  "hot-reload",
  "health-check",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.0",
  "typer>=0.12",
  "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/stackpilot-dev/stackpilot"
Repository = "https://github.com/stackpilot-dev/stackpilot"
Documentation = "https://github.com/stackpilot-dev/stackpilot#readme"
Changelog = "https://github.com/stackpilot-dev/stackpilot/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/stackpilot-dev/stackpilot/issues"
"Security Policy" = "https://github.com/stackpilot-dev/stackpilot/blob/main/SECURITY.md"

[project.scripts]
stackpilot = "stackpilot.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "stackpilot.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stackpilot = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
